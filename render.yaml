services:
  - type: web
    name: sf-torres-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --production=false
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sf-torres-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://sf-torres-web.onrender.com

  - type: web
    name: sf-torres-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --production=false && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        value: https://sf-torres-api.onrender.com

databases:
  - name: sf-torres-db
    databaseName: sf_torres
    user: sf_torres
